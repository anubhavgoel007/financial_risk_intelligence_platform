services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src:/app/src

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: risk_platform
      POSTGRES_PASSWORD: risk_platform
      POSTGRES_DB: risk_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
